<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EvoForm · In Accordance with Nature · Form Shaped by Evolution</title>
    <meta
      name="description"
      content="EvoForm · nature-inspired underwater vehicles for long, quiet observation. In Accordance with Nature · Form Shaped by Evolution."
    />
    <meta name="theme-color" content="#0a1412" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://evoform.no/" />
    <meta property="og:title" content="EvoForm · nature-inspired underwater vehicles" />
    <meta
      property="og:description"
      content="In Accordance with Nature · Form Shaped by Evolution."
    />
    <meta property="og:url" content="https://evoform.no/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EvoForm" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="EvoForm · nature-inspired underwater vehicles" />
    <meta
      name="twitter:description"
      content="In Accordance with Nature · Form Shaped by Evolution."
    />
    <style>
      :root {
        --bg: #0a1412;
        --ink: #e6f0ec;
        --muted: #8fa89e;
        --line: rgba(230, 240, 236, 0.12);
        --accent: #5ec9a8;
        --max: 34rem;
        --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: 1.02rem;
        line-height: 1.65;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(94, 201, 168, 0.07), transparent 55%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: var(--max);
        margin: 0 auto;
        padding: max(3.25rem, env(safe-area-inset-top)) max(1.35rem, env(safe-area-inset-right))
          max(3.5rem, env(safe-area-inset-bottom)) max(1.35rem, env(safe-area-inset-left));
      }

      .mark {
        display: inline-block;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
        margin: 0 0 1.75rem;
      }

      /* Pair as two intentional lines — no mid-phrase wrap */
      h1.pair {
        font-family: var(--font-display);
        font-size: clamp(1.7rem, 5.2vw, 2.35rem);
        font-weight: 700;
        line-height: 1.22;
        letter-spacing: -0.02em;
        margin: 0 0 1.65rem;
        max-width: 18rem;
        color: var(--ink);
      }

      h1.pair .line {
        display: block;
      }

      h1.pair .line-b {
        font-weight: 550;
        color: rgba(230, 240, 236, 0.88);
        margin-top: 0.28em;
      }

      h1.pair .dot {
        color: var(--accent);
        font-weight: 500;
        margin-right: 0.28em;
        opacity: 0.85;
      }

      .lede {
        font-size: 1.08rem;
        font-weight: 450;
        color: var(--muted);
        margin: 0 0 2.5rem;
        max-width: 30rem;
        line-height: 1.55;
      }

      .sister {
        margin: 0 0 2.75rem;
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.5;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }

      a:hover {
        border-bottom-color: rgba(94, 201, 168, 0.45);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 0.2rem;
      }

      footer {
        margin-top: 0;
        padding-top: 1.35rem;
        border-top: 1px solid var(--line);
        font-size: 0.8125rem;
        color: var(--muted);
        line-height: 1.55;
      }

      .foot-links {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.25rem 0;
        margin: 0;
      }

      .foot-links a {
        color: var(--muted);
        border-bottom-color: transparent;
      }

      .foot-links a:hover {
        color: var(--accent);
        border-bottom-color: rgba(94, 201, 168, 0.4);
      }

      .sep {
        margin: 0 0.5rem;
        opacity: 0.4;
        user-select: none;
      }

      @media (max-width: 420px) {
        body {
          font-size: 1rem;
          line-height: 1.68;
        }

        .wrap {
          padding-left: max(1.15rem, env(safe-area-inset-left));
          padding-right: max(1.15rem, env(safe-area-inset-right));
          padding-top: max(2.5rem, env(safe-area-inset-top));
        }

        h1.pair {
          font-size: clamp(1.65rem, 7.2vw, 1.95rem);
          max-width: 14.5rem;
          margin-bottom: 1.4rem;
        }

        .lede {
          font-size: 1.02rem;
          max-width: none;
          margin-bottom: 2.15rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="mark">EvoForm</p>
      <h1 class="pair">
        <span class="line">In Accordance with Nature</span>
        <span class="line line-b"
          ><span class="dot" aria-hidden="true">·</span>Form Shaped by Evolution</span
        >
      </h1>
      <p class="lede">
        Nature-inspired underwater vehicles for long, quiet observation.
      </p>
      <p class="sister">
        Sister · <a href="https://cetavox.com/">CetaVox</a> · deciphering whale and dolphin sounds
      </p>
      <footer>
        <p class="foot-links">
          <a href="https://github.com/revrune/evoform">GitHub</a>
          <span class="sep" aria-hidden="true">·</span>
          <a href="https://cetavox.com/">CetaVox</a>
        </p>
      </footer>
    </div>
  </body>
</html>
