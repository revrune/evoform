<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EvoForm · Shaped by Evolution · In Accordance with Nature</title>
    <meta
      name="description"
      content="EvoForm · form shaped by evolution. EvoMarine · EvoAir · EvoTerra. Nature-inspired platforms for long, quiet observation."
    />
    <meta name="theme-color" content="#0a1412" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://evoform.no/" />
    <link rel="icon" href="/brand/favicon.svg?v=1" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/mark.svg?v=1" />
    <meta property="og:title" content="EvoForm · Shaped by Evolution" />
    <meta
      property="og:description"
      content="Shaped by Evolution · In Accordance with Nature. EvoMarine · EvoAir · EvoTerra."
    />
    <meta property="og:url" content="https://evoform.no/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EvoForm" />
    <meta property="og:image" content="https://evoform.no/path-a/mockups/form-threequarter.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EvoForm · Shaped by Evolution" />
    <meta
      name="twitter:description"
      content="Shaped by Evolution · In Accordance with Nature."
    />
    <style>
      :root {
        --bg: #0a1412;
        --ink: #e6f0ec;
        --muted: #8fa89e;
        --line: rgba(230, 240, 236, 0.12);
        --accent: #5ec9a8;
        --max: 34rem;
        --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: 1.02rem;
        line-height: 1.65;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(94, 201, 168, 0.07), transparent 55%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: var(--max);
        margin: 0 auto;
        padding: max(3.25rem, env(safe-area-inset-top)) max(1.35rem, env(safe-area-inset-right))
          max(3.5rem, env(safe-area-inset-bottom)) max(1.35rem, env(safe-area-inset-left));
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.85rem 1.25rem;
        margin: 0 0 1.85rem;
        flex-wrap: wrap;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0;
        text-decoration: none;
        color: inherit;
        border: 0;
        flex-shrink: 0;
      }

      .brand img {
        width: 2.15rem;
        height: 2.15rem;
        border-radius: 0.45rem;
        display: block;
        flex-shrink: 0;
      }

      .brand .mark {
        display: inline-block;
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
        margin: 0;
      }

      .topbar .north {
        margin: 0;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        line-height: 1.35;
        text-align: right;
        max-width: 11.5rem;
      }

      h1.hero {
        font-family: var(--font-display);
        font-size: clamp(1.7rem, 5.2vw, 2.35rem);
        font-weight: 700;
        line-height: 1.18;
        letter-spacing: -0.02em;
        margin: 0 0 1.5rem;
        max-width: 12rem;
        color: var(--ink);
      }

      /* Three clean verticals · secondary detail lives one click deeper */
      .verticals {
        list-style: none;
        margin: 0 0 2.5rem;
        padding: 0;
        max-width: 28rem;
        border-top: 1px solid var(--line);
      }

      .verticals > li {
        border-bottom: 1px solid var(--line);
      }

      .verticals .v-row {
        display: grid;
        grid-template-columns: 7.5rem 1fr;
        gap: 0.65rem 1rem;
        align-items: baseline;
        padding: 0.85rem 0;
        font-size: 0.95rem;
        line-height: 1.45;
        color: inherit;
        text-decoration: none;
        border-bottom: none;
        margin: 0;
        border-radius: 0.25rem;
        transition: background 0.15s ease;
      }

      .verticals a.v-row:hover {
        background: rgba(94, 201, 168, 0.05);
        border-bottom-color: transparent;
      }

      .verticals a.v-row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .verticals .v-name {
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--ink);
      }

      .verticals a.v-row .v-name {
        color: var(--accent);
      }

      .verticals .v-role {
        color: var(--muted);
        font-weight: 450;
      }

      .verticals .v-soon .v-name {
        color: rgba(230, 240, 236, 0.72);
      }

      .verticals .v-soon .v-role {
        color: rgba(143, 168, 158, 0.8);
      }

      .related {
        margin: 0 0 2.75rem;
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.5;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }

      a:hover {
        border-bottom-color: rgba(94, 201, 168, 0.45);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 0.2rem;
      }

      @media (max-width: 420px) {
        body {
          font-size: 1rem;
          line-height: 1.68;
        }

        .wrap {
          padding-left: max(1.15rem, env(safe-area-inset-left));
          padding-right: max(1.15rem, env(safe-area-inset-right));
          padding-top: max(2.5rem, env(safe-area-inset-top));
        }

        .topbar {
          margin-bottom: 1.6rem;
        }

        .topbar .north {
          font-size: 0.68rem;
          max-width: 9.5rem;
        }

        h1.hero {
          font-size: clamp(1.65rem, 7.2vw, 1.95rem);
          max-width: 11rem;
          margin-bottom: 1.4rem;
        }

        .verticals .v-row {
          grid-template-columns: 1fr;
          gap: 0.15rem;
          padding: 0.75rem 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <a class="brand" href="/" aria-label="EvoForm home">
          <img src="/brand/mark.svg?v=1" width="34" height="34" alt="" />
          <span class="mark">EvoForm</span>
        </a>
        <p class="north">In Accordance with Nature</p>
      </div>
      <h1 class="hero">Shaped by Evolution</h1>

      <ul class="verticals" aria-label="EvoForm verticals">
        <li>
          <a class="v-row" href="/evomarine/">
            <span class="v-name">EvoMarine</span>
            <span class="v-role">Quiet Extended Presence</span>
          </a>
        </li>
        <li class="v-soon">
          <div class="v-row">
            <span class="v-name">EvoAir</span>
            <span class="v-role">Quiet aerial co-presence and survey</span>
          </div>
        </li>
        <li class="v-soon">
          <div class="v-row">
            <span class="v-name">EvoTerra</span>
            <span class="v-role">Ground, soil, and terrain platforms</span>
          </div>
        </li>
      </ul>

      <p class="related">
        <a href="https://cetavox.com/">CetaVox</a> · deciphering whale and dolphin sounds
      </p>
    </div>
  </body>
</html>
