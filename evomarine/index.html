<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>EvoMarine · EvoForm</title>
    <meta
      name="description"
      content="EvoMarine · quiet co-presence with marine life. Board and path concept views."
    />
    <meta name="theme-color" content="#0a1412" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://evoform.no/evomarine/" />
    <link rel="icon" href="/brand/favicon.svg?v=1" type="image/svg+xml" />
    <meta property="og:title" content="EvoMarine · EvoForm" />
    <meta
      property="og:description"
      content="Quiet co-presence with marine life · board · path concept views."
    />
    <meta property="og:url" content="https://evoform.no/evomarine/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EvoForm" />
    <meta property="og:image" content="https://evoform.no/path-a/mockups/form-threequarter.jpg" />
    <style>
      :root {
        --bg: #0a1412;
        --ink: #e6f0ec;
        --muted: #8fa89e;
        --line: rgba(230, 240, 236, 0.12);
        --accent: #5ec9a8;
        --max: 34rem;
        --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        background: var(--bg);
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        color: var(--ink);
        font-family: var(--font-ui);
        font-size: 1.02rem;
        line-height: 1.65;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(94, 201, 168, 0.07), transparent 55%),
          var(--bg);
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: var(--max);
        margin: 0 auto;
        padding: max(3.25rem, env(safe-area-inset-top)) max(1.35rem, env(safe-area-inset-right))
          max(3.5rem, env(safe-area-inset-bottom)) max(1.35rem, env(safe-area-inset-left));
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.85rem 1.25rem;
        margin: 0 0 1.85rem;
        flex-wrap: wrap;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0;
        text-decoration: none;
        color: inherit;
        border: 0;
      }

      .brand img {
        width: 2.15rem;
        height: 2.15rem;
        border-radius: 0.45rem;
        display: block;
      }

      .brand .mark {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 600;
      }

      .topbar .north {
        margin: 0;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        color: var(--muted);
        line-height: 1.35;
        text-align: right;
        max-width: 11.5rem;
      }

      .crumb {
        margin: 0 0 0.85rem;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .crumb a {
        color: var(--muted);
        border-bottom: none;
      }

      .crumb a:hover {
        color: var(--accent);
      }

      h1 {
        font-family: var(--font-display);
        font-size: clamp(1.7rem, 5.2vw, 2.2rem);
        font-weight: 700;
        line-height: 1.18;
        letter-spacing: -0.02em;
        margin: 0 0 0.45rem;
        color: var(--ink);
      }

      .lede {
        margin: 0 0 1.75rem;
        color: var(--muted);
        font-size: 1rem;
        max-width: 28rem;
      }

      .paths {
        list-style: none;
        margin: 0 0 2.5rem;
        padding: 0;
        max-width: 28rem;
        border-top: 1px solid var(--line);
      }

      .paths li {
        border-bottom: 1px solid var(--line);
      }

      .paths a {
        display: block;
        padding: 0.95rem 0;
        color: inherit;
        text-decoration: none;
        border-bottom: none;
        transition: background 0.15s ease;
        border-radius: 0.25rem;
      }

      .paths a:hover {
        background: rgba(94, 201, 168, 0.05);
        border-bottom-color: transparent;
      }

      .paths a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .paths .p-title {
        display: block;
        font-size: 1rem;
        font-weight: 600;
        color: var(--ink);
        margin: 0 0 0.3rem;
      }

      .paths .p-title::after {
        content: " →";
        color: var(--accent);
        opacity: 0.8;
        font-weight: 500;
      }

      .paths .p-desc {
        display: block;
        font-size: 0.9rem;
        color: var(--muted);
        line-height: 1.45;
        margin: 0;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
      }

      a:hover {
        border-bottom-color: rgba(94, 201, 168, 0.45);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 0.2rem;
      }

      @media (max-width: 420px) {
        .wrap {
          padding-left: max(1.15rem, env(safe-area-inset-left));
          padding-right: max(1.15rem, env(safe-area-inset-right));
          padding-top: max(2.5rem, env(safe-area-inset-top));
        }

        .topbar .north {
          font-size: 0.68rem;
          max-width: 9.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <a class="brand" href="/" aria-label="EvoForm home">
          <img src="/brand/mark.svg?v=1" width="34" height="34" alt="" />
          <span class="mark">EvoForm</span>
        </a>
        <p class="north">In Accordance with Nature</p>
      </div>

      <p class="crumb"><a href="/">EvoForm</a> · EvoMarine</p>
      <h1>EvoMarine</h1>
      <p class="lede">Quiet co-presence with marine life.</p>

      <ul class="paths" aria-label="EvoMarine paths">
        <li>
          <a href="/path-a/board/">
            <span class="p-title">Board</span>
            <span class="p-desc">Active stability · leatherback sea turtle as teacher</span>
          </a>
        </li>
        <li>
          <a href="/path-a/">
            <span class="p-title">Path</span>
            <span class="p-desc">Concept views</span>
          </a>
        </li>
      </ul>
    </div>
  </body>
</html>
