# Deploy public door + Path A concept to GitHub Pages.
name: Deploy public door

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - "CNAME"
      - ".nojekyll"
      - "version.json"
      - "path-a/**"
      - ".github/workflows/deploy-public-door.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: evoform-public-door
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage door files + Path A
        run: |
          mkdir -p _site
          cp index.html 404.html CNAME .nojekyll version.json _site/
          cp -R path-a _site/path-a
          find _site -type f | sort

      # Prefer direct gh-pages publish so we are not blocked on environment approval
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          cname: evoform.no

      - name: Also try official Pages artifact deploy
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages (official)
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4
