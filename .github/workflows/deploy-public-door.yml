# Deploy public door + Path A concept to GitHub Pages.
# Research tree on main is not published — only door + path-a public surface.
name: Deploy public door

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "404.html"
      - "CNAME"
      - ".nojekyll"
      - "version.json"
      - "path-a/**"
      - ".github/workflows/deploy-public-door.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evoform-public-door
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage door files + Path A
        run: |
          mkdir -p _site
          cp index.html 404.html CNAME .nojekyll version.json _site/
          if [ -d path-a ]; then
            cp -R path-a _site/path-a
          fi
          # Ensure directory URLs work
          if [ -f _site/path-a/index.html ]; then
            echo "path-a staged"
          fi
          find _site -type f | sort
          ls -la _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
