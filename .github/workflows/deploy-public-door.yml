name: Deploy public door

# DEPRECATED as primary ship path (2026-08-08).
# Live host is Vercel; ship with: python3 tools/deploy-vercel-rest.py
# See docs/ops/vercel-deploy-primary-2026-08-08.md
# GHA VERCEL_TOKEN secret is known-invalid — do not wait on this workflow.
# Kept only as optional archive after someone installs a valid token.

on:
  workflow_dispatch:
  # push trigger disabled — primary deploy is REST/MCP, not GHA

concurrency:
  group: evoform-public-door
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL secrets missing — skip GHA deploy."
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.secrets.outputs.missing == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        if: steps.secrets.outputs.missing == 'false'
        run: npm install -g vercel@58

      - name: Stage public door
        if: steps.secrets.outputs.missing == 'false'
        run: bash tools/stage-public-door.sh _public

      - name: Deploy to Vercel (production)
        if: steps.secrets.outputs.missing == 'false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p _public/.vercel
          printf '%s\n' "{\"projectId\":\"$VERCEL_PROJECT_ID\",\"orgId\":\"$VERCEL_ORG_ID\",\"projectName\":\"evoform-no\"}" > _public/.vercel/project.json
          # Deploy staged static tree only (no git author identity trap)
          cd _public
          vercel deploy . --prod --yes --token="$VERCEL_TOKEN"
