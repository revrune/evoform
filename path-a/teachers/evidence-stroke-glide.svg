<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Two-segment chart: about 30 percent thrust effort and 70 percent glide coast">
  <rect width="640" height="360" fill="#0a1412"/>
  <text x="320" y="36" text-anchor="middle" fill="#e6f0ec" font-family="Georgia,serif" font-size="18">Stroke–glide duty cycle</text>
  <text x="320" y="58" text-anchor="middle" fill="#8fa89e" font-family="system-ui,sans-serif" font-size="12">Turtle propulsion studies · order-of-magnitude lab pattern</text>
  <!-- stacked horizontal bar -->
  <rect x="80" y="140" width="480" height="64" rx="10" fill="#121f1c"/>
  <rect x="80" y="140" width="144" height="64" rx="10" fill="#5ec9a8"/>
  <rect x="224" y="140" width="336" height="64" rx="0" fill="#1a2e28"/>
  <rect x="80" y="140" width="480" height="64" rx="10" fill="none" stroke="#5ec9a8" stroke-width="1.5"/>
  <text x="152" y="178" text-anchor="middle" fill="#0a1412" font-family="system-ui,sans-serif" font-size="15" font-weight="600">~30%</text>
  <text x="390" y="178" text-anchor="middle" fill="#e6f0ec" font-family="system-ui,sans-serif" font-size="15" font-weight="600">~70% glide / coast</text>
  <text x="152" y="230" text-anchor="middle" fill="#8fa89e" font-family="system-ui,sans-serif" font-size="13">Thrust effort</text>
  <text x="390" y="230" text-anchor="middle" fill="#8fa89e" font-family="system-ui,sans-serif" font-size="13">Mass + low drag carry the coast</text>
  <text x="320" y="300" text-anchor="middle" fill="#e6f0ec" font-family="system-ui,sans-serif" font-size="14">Energy in short windows · calm between them</text>
  <text x="320" y="340" text-anchor="middle" fill="#5c756c" font-family="system-ui,sans-serif" font-size="11">EvoForm diagram · illustrative</text>
</svg>
